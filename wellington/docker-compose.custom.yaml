services:
  open-webui:
    image: open-webui
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    ports:
      - "3000:8080"
    environment:
      - OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WEB_LOADER_ENGINE=safe_web
      - PLAYWRIGHT_TIMEOUT=60000
      - WHISPER_MODEL=base
      - SESSION_SECRET=${SESSION_SECRET}
      - DO_NOT_TRACK=true
      # Points OpenWebUI to the internal Docling service
      - DOCLING_API_URL=http://docling-server:5001/v1/convert
      - DOCLING_API_KEY=${DOCLING_API_KEY}
      - ENABLE_SEARCH_WEB_TOOL=true
    extra_hosts:
      - host.docker.internal:host-gateway
    mem_limit: 8G
    restart: always
    # GPU support:
    # Linux NVIDIA: add `runtime: nvidia` and install nvidia-container-toolkit
    # Docker Desktop: GPUs auto-exposed; no extra config needed


  # Docling Document Parser Service
  docling-server:
    image: hwdsl2/docling-server:latest
    container_name: docling-server
    restart: always
    environment:
      # Limits CPU threads to prevent it from starving your LLM
      - OMP_NUM_THREADS=6
      - DOCLING_API_KEY=${DOCLING_API_KEY}
    mem_limit: 6G 
    ports:
      - "3001:5001"

volumes:
  open-webui:
    external: true